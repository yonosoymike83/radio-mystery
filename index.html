<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Mystery Radio Cache</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#111;color:#f7f7f7;font-family:Arial,Helvetica,sans-serif}
    .home{width:min(100% - 40px,660px);height:100svh;margin:0 auto;padding:clamp(10px,2vh,22px) 0 clamp(10px,2vh,22px);display:flex;flex-direction:column;align-items:center;overflow:hidden}
    .home-logo{display:block;width:auto;height:clamp(120px,30svh,310px);max-width:min(66vw,350px);aspect-ratio:1;object-fit:contain;margin:0 auto clamp(8px,1.5vh,16px);flex:0 1 auto;min-height:0}
    .home-title{flex:0 0 auto;font-size:clamp(25px,5.5vw,42px);line-height:1.08;font-weight:700;text-align:center;margin:0 0 clamp(12px,2.2vh,22px);letter-spacing:-.6px}
    .transmissions{width:100%;min-height:0;flex:1;display:flex;flex-direction:column;gap:clamp(7px,1.3vh,13px)}
    .transmission-link{flex:1;min-height:0;padding:7px 12px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#f5f5f5;background:#242424;border-radius:16px;font-size:clamp(17px,3.7vw,25px);font-weight:400;transition:background .15s ease}
    .transmission-link:active{background:#333}
    @media(max-height:650px){.home-logo{height:22svh;margin-bottom:6px}.home-title{font-size:clamp(22px,4.8vw,32px);margin-bottom:8px}.transmissions{gap:6px}.transmission-link{font-size:17px;border-radius:12px}}
  </style>
</head>
<body>
  <main class="home">
    <img class="home-logo" src="assets/radio-mystery-logo.png" alt="Mystery Radio Cache logo">
    <h1 class="home-title" id="cacheTitle">Mystery Radio Cache</h1>
    <nav class="transmissions" id="transmissions" aria-label="Transmissions"></nav>
  </main>
  <script src="transmissions.js"></script>
  <script>
    const cfg = window.MYSTERY_CONFIG || {};
    document.title = cfg.title || 'Mystery Radio Cache';
    document.getElementById('cacheTitle').textContent = cfg.title || 'Mystery Radio Cache';
    const list = document.getElementById('transmissions');
    (cfg.transmissions || []).forEach((item, index) => {
      const link = document.createElement('a');
      link.className = 'transmission-link';
      link.href = 'radio.html?id=' + encodeURIComponent(item.id);
      link.textContent = item.title || `Transmission ${String(index + 1).padStart(2,'0')}`;
      list.appendChild(link);
    });
  </script>
</body>
</html>
