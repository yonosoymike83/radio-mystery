<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Mystery Radio Cache</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#111;color:#f7f7f7;font-family:Arial,Helvetica,sans-serif}
    .home{width:min(100% - 40px,660px);margin:0 auto;padding:30px 0 42px;display:flex;flex-direction:column;align-items:center}
    .home-logo{display:block;width:min(66vw,420px);height:auto;aspect-ratio:1;object-fit:contain;margin:0 auto 28px}
    .home-title{font-size:clamp(29px,6vw,52px);line-height:1.12;font-weight:700;text-align:center;margin:0 0 38px;letter-spacing:-.6px}
    .transmissions{width:100%;display:flex;flex-direction:column;gap:20px}
    .transmission-link{min-height:84px;padding:18px 16px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#f5f5f5;background:#242424;border-radius:17px;font-size:clamp(21px,4.2vw,29px);font-weight:400;transition:background .15s ease}
    .transmission-link:active{background:#333}
    @media(min-width:700px){.home{padding-top:36px}.home-logo{width:350px}.home-title{margin-bottom:38px}}
  </style>
</head>
<body>
  <main class="home">
    <img class="home-logo" src="assets/radio-mystery-logo.png" alt="Mystery Radio Cache logo">
    <h1 class="home-title" id="cacheTitle">Mystery Radio Cache</h1>
    <nav class="transmissions" id="transmissions" aria-label="Transmissions"></nav>
  </main>
  <script src="transmissions.js"></script>
  <script>
    const cfg = window.MYSTERY_CONFIG || {};
    document.title = cfg.title || 'Mystery Radio Cache';
    document.getElementById('cacheTitle').textContent = cfg.title || 'Mystery Radio Cache';
    const list = document.getElementById('transmissions');
    (cfg.transmissions || []).forEach((item, index) => {
      const link = document.createElement('a');
      link.className = 'transmission-link';
      link.href = 'radio.html?id=' + encodeURIComponent(item.id);
      link.textContent = item.title || `Transmission ${String(index + 1).padStart(2,'0')}`;
      list.appendChild(link);
    });
  </script>
</body>
</html>
