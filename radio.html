
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Mystery Radio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <h1 class="page-title">Mystery Radio</h1>

    <header class="topbar">
      <a class="back-link" href="index.html" aria-label="Volver">←</a>
      <div class="brand-mark">MR <span>70</span></div>
      <div class="status" aria-label="Estado">
        <i id="powerLed"></i>
        <span id="statusText">OFF</span>
      </div>
    </header>

    <section class="radio-shell" aria-label="Radio portátil antigua">

      <div class="radio-top">
        <div class="screw"></div>
        <div class="radio-name"></div>
        <div class="screw"></div>
      </div>

      <div class="dial-window">
        <div class="dial-head">
          <span class="dial-fm">FM</span>
          <strong id="frequencyReadout">——.— <small>MHz</small></strong>
        </div>

        <div class="scale" id="scale" aria-label="Escala FM">
          <div class="scale-numbers">
            <span>88</span><span>92</span><span>96</span>
            <span>100</span><span>104</span><span>108</span>
          </div>
          <div class="ticks"></div>
          <div class="needle" id="needle"><div></div></div>
          <div class="scale-caption">88 <span></span> 108</div>
        </div>
      </div>

      <div class="radio-face">
        <div class="speaker-wrap">
          <div class="speaker" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <div class="signal-block" aria-hidden="true">
            <div class="signal-bars" id="signalBars">
              <i></i><i></i><i></i><i></i>
              <i></i><i></i><i></i><i></i>
            </div>
            <div class="signal-caption" id="signalCaption">—</div>
          </div>

          <div class="tuning-control">
            <div class="knob-area">
              <div class="knob-ring">
                <div class="knob" id="knob"
                  role="slider"
                  tabindex="0"
                  aria-label="Sintonizar"
                  aria-valuemin="88"
                  aria-valuemax="108"
                  aria-valuenow="94">
                  <div class="knob-line"></div>
                  <div class="knob-center"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="radio-bottom">
        <span>88–108 MHz</span><span>•</span><span>FM</span>
      </div>
    </section>

    <section class="player-panel">

      <div class="frequency-line">
        <span>FM</span>
        <strong id="frequencyLabel">94.0 MHz</strong>
      </div>

      <div class="meter">
        <div id="meterFill"></div>
      </div>

      <div class="feedback" id="feedback">Enciende la radio.</div>

      <div class="actions">
        <button class="power-button" id="powerButton">
          <span class="power-icon" aria-hidden="true">⏻</span>
          <span id="powerButtonText">ENCENDER RADIO</span>
        </button>

        <button class="reset-button" id="resetButton"
          title="Reiniciar frecuencia" aria-label="Reiniciar">↺</button>
      </div>

      <div class="transmission" id="transmission" hidden>
        <div class="on-air"><i></i> TRANSMISIÓN RECIBIDA</div>
        <p>LISTEN CAREFULLY</p>
        <div class="coordinates-note">NOTE THE COORDINATES</div>
      </div>

    </section>
  </main>

  <audio id="voiceAudio"
    src="assets/transmission.mp3"
    preload="auto"
    loop></audio>

  <script src="transmissions.js"></script>
  <script src="app.js"></script>
</body>
</html>
